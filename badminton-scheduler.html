<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Game Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            
            .container {
                padding: 0.5rem;
            }
            
            h1 {
                font-size: 1.75rem !important;
            }
            
            h2 {
                font-size: 1.25rem !important;
            }
        }
        
        @media (max-width: 480px) {
            body {
                font-size: 12px;
            }
            
            h1 {
                font-size: 1.5rem !important;
            }
            
            .glass-morphism {
                padding: 1rem !important;
            }
        }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .glass-morphism {
                border-radius: 12px;
                padding: 1rem;
            }
        }
        
        .player-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin: 8px;
            cursor: move;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            touch-action: none;
        }
        
        @media (max-width: 768px) {
            .player-card {
                padding: 8px;
                margin: 4px;
                font-size: 0.875rem;
            }
        }
        
        .player-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        
        .player-card.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }
        
        .pair-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 12px;
            margin: 8px;
            cursor: move;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            touch-action: none;
        }
        
        @media (max-width: 768px) {
            .pair-card {
                padding: 8px;
                margin: 4px;
                font-size: 0.875rem;
            }
        }
        
        .pair-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        
        .pair-card.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }
        
        .session-slot {
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .session-slot {
                padding: 12px;
                min-height: 80px;
            }
        }
        
        @media (max-width: 480px) {
            .session-slot {
                padding: 8px;
                min-height: 60px;
            }
        }
        
        .session-slot.drag-over {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
            border-style: solid;
        }
        
        .session-slot.occupied {
            border-style: solid;
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.1);
        }
        
        .court-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            .court-card {
                padding: 12px;
                margin: 8px;
                border-radius: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .court-card {
                padding: 8px;
                margin: 4px;
                border-radius: 8px;
            }
        }
        
        .time-slot {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 16px;
            margin: 8px 0;
            border-left: 4px solid #667eea;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                width: 95%;
                border-radius: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .modal-content {
                padding: 16px;
                width: 98%;
                border-radius: 12px;
            }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .btn-primary {
                padding: 10px 20px;
                font-size: 0.875rem;
            }
        }
        
        @media (max-width: 480px) {
            .btn-primary {
                padding: 8px 16px;
                font-size: 0.75rem;
                width: 100%;
            }
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .btn-secondary {
                padding: 10px 20px;
                font-size: 0.875rem;
            }
        }
        
        @media (max-width: 480px) {
            .btn-secondary {
                padding: 8px 16px;
                font-size: 0.75rem;
                width: 100%;
            }
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .success { background: #48bb78; }
        .error { background: #f56565; }
        .warning { background: #ed8936; }
        .info { background: #4299e1; }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">
                <span class="bg-white text-purple-600 px-3 py-1 rounded-lg font-bold mr-3">GYZ</span>Badminton Scheduler
            </h1>
            <p class="text-gray-200">Manage players, create pairs, and schedule matches efficiently</p>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Mobile Layout Toggle -->
            <div class="lg:hidden mb-4">
                <div class="flex space-x-2">
                    <button onclick="showMobileView('players')" id="mobilePlayersBtn" class="flex-1 bg-white/20 text-white px-3 py-2 rounded-lg text-sm">
                        <i class="fas fa-users mr-1"></i>Players
                    </button>
                    <button onclick="showMobileView('sessions')" id="mobileSessionsBtn" class="flex-1 bg-white/10 text-white px-3 py-2 rounded-lg text-sm">
                        <i class="fas fa-calendar mr-1"></i>Sessions
                    </button>
                </div>
            </div>
            <!-- Left Panel - Players/Pairs -->
            <div class="lg:col-span-1" id="playersPanel">
                <div class="glass-morphism p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-white">Players & Pairs</h2>
                        <div class="space-x-2">
                            <button onclick="openAddPlayerModal()" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-lg text-sm">
                                <i class="fas fa-user-plus mr-1"></i>Add Player
                            </button>
                            <button onclick="openCreatePairModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg text-sm">
                                <i class="fas fa-users mr-1"></i>Create Pair
                            </button>
                        </div>
                    </div>
                    
                    <!-- View Toggle -->
                    <div class="flex space-x-2 mb-4">
                        <button onclick="showView('players')" id="playersViewBtn" class="flex-1 bg-white/20 text-white px-3 py-2 rounded-lg text-sm">
                            Players
                        </button>
                        <button onclick="showView('pairs')" id="pairsViewBtn" class="flex-1 bg-white/10 text-white px-3 py-2 rounded-lg text-sm">
                            Pairs
                        </button>
                    </div>
                    
                    <!-- Players List -->
                    <div id="playersList" class="space-y-2 max-h-96 overflow-y-auto">
                        <!-- Players will be added here dynamically -->
                    </div>
                    
                    <!-- Pairs List -->
                    <div id="pairsList" class="space-y-2 max-h-96 overflow-y-auto" style="display: none;">
                        <!-- Pairs will be added here dynamically -->
                    </div>
                </div>
            </div>

            <!-- Right Panel - Sessions -->
            <div class="lg:col-span-2" id="sessionsPanel">
                <div class="glass-morphism p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-white">Game Sessions</h2>
                        <div class="space-x-2">
                            <button onclick="openCreateSessionModal()" class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 rounded-lg text-sm">
                                <i class="fas fa-calendar-plus mr-1"></i>New Session
                            </button>
                            <button onclick="clearAllSessions()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm">
                                <i class="fas fa-trash mr-1"></i>Clear All
                            </button>
                        </div>
                    </div>
                    
                    <!-- Sessions Container -->
                    <div id="sessionsContainer" class="space-y-4">
                        <!-- Sessions will be added here dynamically -->
                    </div>
                    
                    <!-- Empty State -->
                    <div id="emptyState" class="text-center py-12">
                        <i class="fas fa-calendar-times text-6xl text-gray-400 mb-4"></i>
                        <p class="text-gray-300">No sessions scheduled yet</p>
                        <button onclick="openCreateSessionModal()" class="mt-4 bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-lg">
                            <i class="fas fa-plus mr-2"></i>Create First Session
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Player Modal -->
    <div id="addPlayerModal" class="modal">
        <div class="modal-content">
            <h3 class="text-2xl font-bold mb-4">Add New Player</h3>
            <form id="addPlayerForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Player Name</label>
                    <input type="text" id="playerName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number (Optional)</label>
                    <input type="tel" id="playerPhone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Skill Level</label>
                    <select id="playerSkill" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                        <option value="expert">Expert</option>
                    </select>
                </div>
                <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                    <button type="submit" class="btn-primary">Add Player</button>
                    <button type="button" onclick="closeModal('addPlayerModal')" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Create Pair Modal -->
    <div id="createPairModal" class="modal">
        <div class="modal-content">
            <h3 class="text-2xl font-bold mb-4">Create Pair</h3>
            <form id="createPairForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Pair Name (Optional)</label>
                    <input type="text" id="pairName" placeholder="e.g., Team A" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Player 1</label>
                    <select id="pairPlayer1" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Select Player 1</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Player 2</label>
                    <select id="pairPlayer2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Select Player 2</option>
                    </select>
                </div>
                <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                    <button type="submit" class="btn-primary">Create Pair</button>
                    <button type="button" onclick="closeModal('createPairModal')" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Create Session Modal -->
    <div id="createSessionModal" class="modal">
        <div class="modal-content">
            <h3 class="text-2xl font-bold mb-4">Create Game Session</h3>
            <form id="createSessionForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Session Name</label>
                    <input type="text" id="sessionName" required placeholder="e.g., Morning Session" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                    <input type="date" id="sessionDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Start Time</label>
                    <input type="time" id="sessionTime" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Number of Courts</label>
                    <input type="number" id="sessionCourts" min="1" max="10" value="2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Match Duration (minutes)</label>
                    <input type="number" id="matchDuration" min="10" max="60" value="30" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                    <button type="submit" class="btn-primary">Create Session</button>
                    <button type="button" onclick="closeModal('createSessionModal')" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="badminton-scheduler.js"></script>
</body>
</html>
